<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QSO Keeper – hvem er med</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16202b;--mute:#8a94a0;--line:#cfd5dc;--acc:#1d6fd6;--done:#e6e8eb;--grn:#1e8e3e}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1c222a;--ink:#e8ecf0;--mute:#7b8591;--line:#38414c;--acc:#5a9cf0;--done:#252b33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sub{color:var(--mute);font-size:13px}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{width:26px;text-align:right;color:var(--mute)}
.call{flex:0 0 280px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--card);overflow:hidden}
.cs{font:700 19px ui-monospace,Menlo,Consolas,monospace}
.nm{font-weight:700;border-left:2px solid var(--line);padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig{flex:0 0 auto;min-width:46px;text-align:center;padding:8px 6px;border:2px solid var(--line);border-radius:6px;font:700 13px system-ui,sans-serif;color:var(--mute)}
.note{flex:1;min-width:0;color:var(--mute);font-size:14px}
.row.done .call{background:var(--done);border-color:var(--line);color:var(--mute)}
.row.sent .call{border-color:var(--grn)}
.row.listen:not(.done) .call{background:var(--done);border-color:var(--line);color:var(--mute)}
.tag{flex:0 0 auto;font:700 12px system-ui,sans-serif;padding:3px 7px;border-radius:5px;background:var(--acc);color:#fff}
.empty{color:var(--mute);padding:24px 0;text-align:center}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>📻 QSO Keeper – hvem er med</h1><div class="sub" id="sub"></div></div><button id="r">Opdater</button></div>
<div id="l"></div>
</main>
<script>
var q=new URLSearchParams(location.search),m=location.hostname.match(/^([^.]+)\.github\.io$/);
var o=q.get("bruger")||(m?m[1]:""),r=q.get("repo")||(m?location.pathname.split("/")[1]:""),p=q.get("fil")||"list.json";
function p2(n){return(n<10?"0":"")+n}
async function load(){
  var sub=document.getElementById("sub"),l=document.getElementById("l");
  if(!o||!r){sub.textContent="Mangler bruger/repository (tilføj ?bruger=...&repo=... til adressen).";return}
  sub.textContent="Henter…";
  try{
    var res=await fetch("https://api.github.com/repos/"+encodeURIComponent(o)+"/"+encodeURIComponent(r)+"/contents/"+p.split("/").map(encodeURIComponent).join("/"),{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"});
    if(!res.ok){sub.textContent="Kunne ikke hente listen ("+res.status+").";return}
    var d=JSON.parse(await res.text()),it=d.items||[];
    l.innerHTML="";
    if(!it.length)l.innerHTML='<div class="empty">Ingen på listen endnu.</div>';
    it.forEach(function(x,n){
      var e=document.createElement("div");e.className="row"+(x.done?" done":"")+(x.sent?" sent":"")+(x.listen?" listen":"");
      e.innerHTML='<div class="num"></div><div class="call"><span class="cs"></span><span class="nm"></span></div><div class="sig"></div><div class="note"></div>';
      e.children[0].textContent=n+1;e.querySelector(".cs").textContent=x.call;e.querySelector(".nm").textContent=x.name||"";
      e.querySelector(".sig").textContent=x.signal?"S"+x.signal:"";e.querySelector(".sig").style.visibility=x.signal?"visible":"hidden";
      e.querySelector(".note").textContent=x.note||"";
      if(x.listen&&!x.done){var t=document.createElement("span");t.className="tag";t.textContent="LYT";e.querySelector(".call").appendChild(t)}
      l.appendChild(e);
    });
    var u=d.updated?new Date(d.updated):null;
    sub.textContent=u?"Liste uploadet "+p2(u.getDate())+"/"+p2(u.getMonth()+1)+" kl. "+p2(u.getHours())+":"+p2(u.getMinutes())+" · "+it.length+" stationer":"";
  }catch(e){sub.textContent="Kunne ikke hente listen – tjek forbindelsen."}
}
document.getElementById("r").onclick=load;
load();setInterval(load,120000);
</script>
</body>
</html>
