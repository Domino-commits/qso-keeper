<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QSO Keeper</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16202b;--mute:#8a94a0;--line:#cfd5dc;--done:#e6e8eb;--grn:#1e8e3e}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1c222a;--ink:#e8ecf0;--mute:#7b8591;--line:#38414c;--done:#252b33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.num{width:30px;text-align:right;color:var(--mute);font-size:18px}
.call{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 16px;border:2px solid var(--ink);border-radius:10px;background:var(--card)}
.cs{font:700 24px ui-monospace,Menlo,Consolas,monospace}
.nm{font:700 20px system-ui,sans-serif;border-left:2px solid var(--line);padding-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .call,.row.listen .call{background:var(--done);border-color:var(--line);color:var(--mute)}
.row.sent .call{border-color:var(--grn)}
#err{color:var(--mute);text-align:center;padding:24px 0}
</style>
</head>
<body>
<main>
<div id="l"></div>
<div id="err"></div>
</main>
<script>
var q=new URLSearchParams(location.search),m=location.hostname.match(/^([^.]+)\.github\.io$/);
var o=q.get("bruger")||(m?m[1]:""),r=q.get("repo")||(m?location.pathname.split("/")[1]:""),p=q.get("fil")||"list.json";
async function load(){
  var l=document.getElementById("l"),err=document.getElementById("err");
  if(!o||!r){err.textContent="Mangler bruger/repository (tilføj ?bruger=...&repo=... til adressen).";return}
  try{
    var res=await fetch("https://api.github.com/repos/"+encodeURIComponent(o)+"/"+encodeURIComponent(r)+"/contents/"+p.split("/").map(encodeURIComponent).join("/"),{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"});
    if(!res.ok){if(!l.children.length)err.textContent="Kunne ikke hente listen ("+res.status+").";return}
    var d=JSON.parse(await res.text()),it=d.items||[];
    err.textContent=it.length?"":"Ingen på listen endnu.";
    l.innerHTML="";
    it.forEach(function(x,n){
      var e=document.createElement("div");e.className="row"+(x.done?" done":"")+(x.sent?" sent":"")+(x.listen&&!x.done?" listen":"");
      e.innerHTML='<div class="num"></div><div class="call"><span class="cs"></span><span class="nm"></span></div>';
      e.querySelector(".num").textContent=n+1;e.querySelector(".cs").textContent=x.call||"";
      var nm=e.querySelector(".nm");if(x.name)nm.textContent=x.name;else nm.remove();
      l.appendChild(e);
    });
  }catch(e){if(!l.children.length)err.textContent="Kunne ikke hente listen – tjek forbindelsen."}
}
load();setInterval(load,60000);
</script>
</body>
</html>
